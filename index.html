<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#221c18">
<title>Herdade da Granja</title>
<meta property="og:title" content="Herdade da Granja">
<meta property="og:description" content="Private preview">
<meta property="og:type" content="website">
<meta property="og:image" content="https://juanpabgs-lang.github.io/hdg-preview/g/og.jpg">
<link rel="icon" href="g/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-display: swap; src: url(g/cormorant.woff2) format("woff2"); }
@font-face { font-family: "Jost"; font-weight: 400; font-display: swap; src: url(g/jost.woff2) format("woff2"); }
:root { --ink: #221c18; --paper: #f6f1ea; --maroon: #7a2a31; --line: rgba(255,255,255,.55); --err: #ffd9c9; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--ink); color: var(--paper); }
body { font-family: "Jost", system-ui, sans-serif; display: grid; place-items: center; min-height: 100dvh; padding: 24px 16px; position: relative; overflow: hidden; }
.bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(34,28,24,.45), rgba(34,28,24,.72)); }
main { position: relative; width: min(360px, 100%); text-align: center; }
.logo { width: min(280px, 78%); height: auto; display: block; margin: 0 auto 28px; }
h1 { font: 500 26px/1.2 "Cormorant Garamond", Georgia, serif; margin-bottom: 22px; }
label { display: block; font-size: 15px; margin-bottom: 8px; text-align: left; }
input { width: 100%; height: 48px; padding: 0 14px; font: 400 16px "Jost", system-ui, sans-serif; color: var(--paper); background: rgba(34,28,24,.55); border: 1px solid var(--line); border-radius: 3px; outline: none; }
input:focus-visible { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
button { width: 100%; height: 48px; margin-top: 12px; font: 400 16px "Jost", system-ui, sans-serif; color: #fff; background: var(--maroon); border: 0; border-radius: 3px; cursor: pointer; }
button:hover { background: #8d3640; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.err { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--err); }
</style>
</head>
<body>
<img class="bg" src="g/cover.jpg" alt="">
<div class="shade"></div>
<main>
  <img class="logo" src="g/logo.svg" alt="Herdade da Granja, Estremoz, Alentejo">
  <h1>Private preview</h1>
  <form id="f" autocomplete="off">
    <label for="p">Password</label>
    <input id="p" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    <button type="submit">Enter</button>
    <p class="err" id="e" role="alert"></p>
  </form>
</main>
<script>
const CHECK = "77cb60bc123e92eeb7652b762596fe519626dea5a930668d4b9b7b7ecc6dee99";
const hex = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const go = slug => location.replace(slug + "/");
try { const s = localStorage.getItem("hdg"); if (s) hex(s).then(h => { if (h === CHECK) go(s); }); } catch {}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const input = document.getElementById("p");
  const slug = (await hex("hdg:" + input.value.trim().toLowerCase())).slice(0, 24);
  if (await hex(slug) === CHECK) { try { localStorage.setItem("hdg", slug); } catch {} go(slug); return; }
  document.getElementById("e").textContent = "That password isn't right. Check Juan Pablo's message.";
  input.select();
});
</script>
</body>
</html>
